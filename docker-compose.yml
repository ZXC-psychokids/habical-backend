version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
    volumes:
      - ./deploy/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -f /migrations/0001_init.sql
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: deploy/docker/auth.Dockerfile
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_PORT: 4011
      AVATAR_STORAGE_DIR: /data/avatars
      AVATAR_BASE_URL: http://localhost:4010/avatars
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "4011:4011"
    volumes:
      - auth_avatars:/data/avatars

  core:
    build:
      context: .
      dockerfile: deploy/docker/core.Dockerfile
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      JWT_SECRET: ${JWT_SECRET}
      CORE_PORT: 4012
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "4012:4012"

  social:
    build:
      context: .
      dockerfile: deploy/docker/social.Dockerfile
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      JWT_SECRET: ${JWT_SECRET}
      SOCIAL_PORT: 4013
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "4013:4013"

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      WORKER_POLL_INTERVAL_SECONDS: "5"
      WORKER_BATCH_SIZE: "10"
      WORKER_RETRY_DELAY_SECONDS: "60"
      WORKER_MAX_ATTEMPTS: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_PORT: 4010
      AUTH_URL: http://auth:4011
      CORE_URL: http://core:4012
      SOCIAL_URL: http://social:4013
    depends_on:
      - auth
      - core
      - social
    ports:
      - "4010:4010"

volumes:
  pg_data:
  auth_avatars:
